name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper if missing
        run: gradle wrapper --gradle-version 8.7 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug -PJARVIS_BACKEND_URL=${{ secrets.JARVIS_BACKEND_URL }} -PJARVIS_DEVICE_TOKEN=${{ secrets.JARVIS_DEVICE_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
